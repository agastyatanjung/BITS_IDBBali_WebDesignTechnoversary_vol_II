<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Formulir Kemitraan — Suaka</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" href="/Asset/icons/tabicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/css/pages/mitra_1.css" />
    <link rel="stylesheet" href="/css/components/button.css" />
    <link rel="stylesheet" href="/css/components/reveal.css" />
    <script>document.documentElement.classList.add("js");</script>
  </head>
  <body>
    <div class="page">

      <div class="media page__bg" data-label="Foto hutan (memenuhi layar)">
        <img src="/Asset/Image/KEMITRAAN/Kemitraan_background.jpg" alt="" />
      </div>

      <div class="page__left">
        <button
          class="circle"
          type="button"
          id="backBtn"
          aria-label="Kembali ke halaman sebelumnya"
        >
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
            <path
              d="M19 12H5m6-6-6 6 6 6"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </button>
        <h1>Kirim Formulir<br />Untuk Tim Kemitraan</h1>
      </div>

      <main class="card" id="card">
        <form id="partnerForm" novalidate>

          <section class="step" data-step="0">
            <h2 class="sec" tabindex="-1">Informasi Pribadi</h2>
            <div class="grid2">
              <div class="field" data-field="first">
                <label for="first">Nama Depan</label>
                <input
                  id="first"
                  name="first"
                  type="text"
                  autocomplete="given-name"
                  required
                /><small class="err"></small>
              </div>
              <div class="field" data-field="last">
                <label for="last">Nama Belakang</label>
                <input
                  id="last"
                  name="last"
                  type="text"
                  autocomplete="family-name"
                /><small class="err"></small>
              </div>
              <div class="field" data-field="phone">
                <label for="phone">Nomor Telepon</label>
                <input
                  id="phone"
                  name="phone"
                  type="tel"
                  autocomplete="tel"
                  required
                /><small class="err"></small>
              </div>
              <div class="field" data-field="email">
                <label for="email">Email</label>
                <input
                  id="email"
                  name="email"
                  type="email"
                  autocomplete="email"
                  required
                /><small class="err"></small>
              </div>
            </div>

            <h2 class="sec">Informasi Instansi</h2>
            <div class="field" data-field="org">
              <label for="org">Nama Instansi</label>
              <input
                id="org"
                name="org"
                type="text"
                autocomplete="organization"
                required
              /><small class="err"></small>
            </div>
            <div class="field" data-field="type">
              <label for="type">Jenis Instansi</label>
              <select id="type" name="type" required>
                <option value="" selected disabled>Pilih jenis instansi</option>
                <option>Perusahaan</option>
                <option>Bank / Lembaga Keuangan</option>
                <option>Kampus / Institusi Pendidikan</option>
                <option>Media</option>
                <option>Komunitas</option>
                <option>Lembaga / Organisasi Nirlaba</option>
                <option>Individu / Keluarga</option></select
              ><small class="err"></small>
            </div>
            <div class="field" data-field="social">
              <label for="social">Media Sosial (Opsional)</label>
              <input
                id="social"
                name="social"
                type="text"
                placeholder="@akun atau tautan"
                maxlength="100"
              /><small class="err"></small>
            </div>

            <button class="next" type="button" data-next>Selanjutnya</button>
          </section>

          <section class="step" data-step="1" hidden>
            <h2 class="sec" tabindex="-1">Rencana Dukungan</h2>

            <div class="field" data-field="support">
              <label for="support"
                >Pilih Jenis Dukungan Yang Ingin Kalian Berikan</label
              >
              <select id="support" name="support" required>
                <option value="" selected disabled>Pilih jenis dukungan</option>
                <option>Sponsorship Program</option>
                <option>Kolaborasi Program</option>
                <option>Mitra Utama</option></select
              ><small class="err"></small>
            </div>

            <div class="field" data-field="program">
              <label for="program">Program Yang Diminati</label>
              <select id="program" name="program" required>
                <option value="" selected disabled>Pilih program</option>
                <option>Patroli ranger</option>
                <option>Penanaman pohon baru</option>
                <option>Pakan satwa</option>
                <option>Rehabilitasi satwa</option>
                <option>Perawatan medis</option>
                <option>Belum menentukan, ingin berdiskusi</option></select
              ><small class="err"></small>
            </div>

            <div class="grid2">
              <div class="field" data-field="scale">
                <label for="scale">Skala Dukungan</label>
                <input
                  id="scale"
                  name="scale"
                  type="text"
                  placeholder="mis. Rp25.000.000"
                  maxlength="80"
                  required
                /><small class="err"></small>
              </div>
              <div class="field" data-field="duration">
                <label for="duration">Jangka Waktu</label>
                <input
                  id="duration"
                  name="duration"
                  type="text"
                  placeholder="mis. 6 bulan"
                  maxlength="60"
                  required
                /><small class="err"></small>
              </div>
            </div>

            <div class="field" data-field="message">
              <label for="message">Pesan Atau Tujuan</label>
              <textarea
                id="message"
                name="message"
                rows="5"
                maxlength="1000"
                required
              ></textarea
              ><small class="err"></small>
            </div>

            <input
              class="hp"
              type="text"
              name="website"
              tabindex="-1"
              autocomplete="off"
              aria-hidden="true"
            />

            <button class="next" type="submit" id="submitBtn">Kirim</button>
          </section>
        </form>

        <section class="step done" data-step="2" hidden>
          <h2 class="sec done__title" tabindex="-1">
            Terima Kasih, <span id="outName"></span>. Pengajuan Anda Sudah
            Terkirim
          </h2>
          <p class="done__lead">
            Kami Akan Menghubungi Anda Dalam <span id="outDays"></span> Hari
            Kerja
          </p>
          <p class="done__id">ID Pengajuan: <b id="outId"></b></p>

          <div
            class="summary"
            id="summary"
            aria-label="Ringkasan pengajuan"
          ></div>

          <div class="done__btns">
            <button class="ghost" type="button" id="copyId">Salin ID</button>
            <button class="ghost" type="button" id="printBtn">
              Cetak / Simpan PDF
            </button>
            <a class="next" href="/index.html">Kembali ke Beranda</a>
          </div>
        </section>
      </main>
    </div>

    <script src="/js/core/reveal.js" defer></script>
    <script src="/js/pages/mitra_1.js" defer></script>
  </body>
</html>
